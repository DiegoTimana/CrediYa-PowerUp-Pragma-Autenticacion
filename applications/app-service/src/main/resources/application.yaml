server:
  port: 8080
adapters:
  r2dbc:
    host: "localhost"
    port: 5433
    database: "crediYa-power-up"
    schema: "public"
    username: ${USUARIO_POSTGRES}
    password: ${CLAVE_POSTGRES}
spring:
  application:
    name: "autenticacion"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
springdoc:
  api-docs:
    enabled: true               # Habilita/deshabilita los docs (default: true)
    path: /swagger-doc/v3/api-docs           # Cambia la URL base de los docs JSON
  swagger-ui:
    enabled: true               # Habilita/deshabilita la UI de Swagger
    path: /swagger-doc/swagger-ui.html      # Cambia la ruta de Swagger UI
