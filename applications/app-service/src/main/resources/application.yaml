server:
  port: 8080
adapters:
  r2dbc:
    host: "localhost"
    port: 5433
    database: "crediYa-power-up"
    schema: "public"
    username: ${USUARIO_POSTGRES}
    password: ${CLAVE_POSTGRES}
spring:
  application:
    name: "autenticacion"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
springdoc:
  swagger-ui:
    path: "/api/doc/swagger-ui.html"
  api-docs:
    path: "/api/doc/api-docs"
